<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catálogo de sacolas | Refood</title>
  <meta name="description" content="Sacolas surpresa com desconto nos comércios perto de você. Filtre por categoria, distância e preço.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap">
  <link rel="stylesheet" href="/css/refood.css">
  <style>
    /* Tela 5.4 do Figma: Catálogo (no celular, tela 1.3) */
    .filtros { background: var(--branco); border-bottom: 1px solid var(--linha); padding-block: 18px; }
    .filtros .container { display: grid; gap: 14px; }
    .filtros-linha { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }

    .busca { flex: 1 1 280px; display: flex; align-items: center; gap: 10px; background: var(--creme); border: 1px solid var(--linha);
      border-radius: var(--raio-p); padding: 3px 3px 3px 14px; }
    .busca:focus-within { border-color: var(--verde); background: var(--branco); }
    .busca svg { width: 18px; height: 18px; color: var(--texto-3); flex: none; }
    .busca input { flex: 1; min-width: 0; border: 0; background: none; min-height: 36px; outline: none; }

    .filtro { display: flex; align-items: center; gap: 8px; }
    .filtro label { font-size: 13px; font-weight: 600; color: var(--texto-2); white-space: nowrap; }
    .filtro .entrada { width: auto; min-height: 40px; padding: 6px 10px; background: var(--branco); }
    .filtro-ordem { margin-left: auto; }
    .filtro-ordem .entrada { border-color: var(--verde); color: var(--verde); font-weight: 600; }
    .chip-esqueleto { display: inline-block; width: 110px; height: 36px; border-radius: 99px; }

    .resultados { padding-block: 40px 16px; display: grid; gap: 24px; }
    .resultados h1 { font-size: 22px; font-weight: 700; letter-spacing: 0; }
    .grade-catalogo { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 24px; }
    .carregar-mais { display: flex; justify-content: center; padding-top: 8px; }
    .carregar-mais .btn { min-width: 240px; }
    .link-limpar { font-weight: 700; }

    @media (max-width: 760px) {
      .filtros .container { padding-inline: 16px; }
      .busca { flex-basis: 100%; }
      .filtro-ordem { margin-left: 0; }
      /* chips de categoria rolam de lado no celular, como na tela 1.3 */
      .chips-rolagem { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; }
      .chips-rolagem .chip { flex: none; }
      .resultados { padding-block: 24px 8px; padding-inline: 16px; }
      .grade-catalogo { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header id="topo"></header>

  <main>
    <section class="filtros" aria-label="Filtros do catálogo">
      <div class="container">
        <div class="filtros-linha">
          <form class="busca" id="form-busca" role="search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
            <label for="busca" class="sr-only">Buscar sacolas</label>
            <input type="search" id="busca" name="busca" placeholder="Buscar sacolas, lojas ou bairros..." maxlength="60" autocomplete="off">
            <button class="btn btn-primario btn-pequeno" type="submit">Buscar</button>
          </form>
          <div class="filtro">
            <label for="raio_km">Distância</label>
            <select class="entrada" id="raio_km">
              <option value="">Qualquer</option>
              <option value="1">Até 1 km</option>
              <option value="3">Até 3 km</option>
              <option value="5">Até 5 km</option>
            </select>
          </div>
          <div class="filtro">
            <label for="preco_max">Preço</label>
            <select class="entrada" id="preco_max">
              <option value="">Qualquer</option>
              <option value="10">Até R$ 10</option>
              <option value="15">Até R$ 15</option>
              <option value="20">Até R$ 20</option>
            </select>
          </div>
          <button class="chip" type="button" id="chip-agora" aria-pressed="false">Disponível agora</button>
          <div class="filtro filtro-ordem">
            <label for="ordem">Ordenar por</label>
            <select class="entrada" id="ordem">
              <option value="proximo">Mais próximo</option>
              <option value="preco">Menor preço</option>
              <option value="desconto">Maior desconto</option>
              <option value="termina">Termina antes</option>
            </select>
          </div>
        </div>
        <div class="chips chips-rolagem" id="chips-categoria" role="group" aria-label="Categoria">
          <span class="esqueleto chip-esqueleto"></span><span class="esqueleto chip-esqueleto"></span>
          <span class="esqueleto chip-esqueleto"></span><span class="esqueleto chip-esqueleto"></span>
        </div>
      </div>
    </section>

    <section class="container resultados" aria-labelledby="titulo-resultados">
      <div class="alerta alerta-info" id="aviso-loja" hidden>
        <span>Mostrando sacolas de <strong id="aviso-loja-nome">uma loja</strong>.
          <a class="link-limpar" id="limpar-loja" href="/catalogo.html">Ver todas as sacolas</a></span>
      </div>
      <h1 id="titulo-resultados" aria-live="polite">Buscando sacolas...</h1>
      <div class="grade-sacolas grade-catalogo" id="grade"></div>
      <div class="carregar-mais">
        <button class="btn btn-contorno" type="button" id="carregar-mais" hidden>Carregar mais sacolas</button>
      </div>
    </section>
  </main>

  <footer id="rodape"></footer>
  <script type="module" src="/js/paginas/catalogo.js"></script>
</body>
</html>
