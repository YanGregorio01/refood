<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Solicitar doação | Refood Parcerias</title>
  <meta name="description" content="Agende a retirada de uma doação de alimentos com um estabelecimento parceiro.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap">
  <link rel="stylesheet" href="/css/refood.css">
  <style>
    /* Tela 6.11 do Figma: Solicitar doação (no celular, tela 4.2).
       Formulário à esquerda e card "Resumo" (com o botão de enviar) à direita. */
    .solicitar { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 24px; align-items: start; max-width: 1100px; }
    .solicitar h2 { font-size: 20px; }
    .form-solicitacao { display: grid; gap: 20px; }

    .loja-escolhida { display: flex; align-items: center; gap: 14px; padding: 14px; border-radius: var(--raio);
      background: var(--verde-fundo); border: 1px solid var(--verde-claro); }
    .loja-escolhida img { width: 60px; height: 60px; border-radius: var(--raio-p); object-fit: cover; flex: none; background: var(--creme-2); }
    .loja-escolhida div { flex: 1; min-width: 0; display: grid; gap: 2px; }
    .loja-escolhida strong { font-family: var(--fonte-titulo); font-size: 17px; }
    .loja-escolhida span:last-child { font-size: 13px; color: var(--texto-2); }
    .loja-escolhida a { font-weight: 700; font-size: 14px; }

    .entrada[readonly] { color: var(--texto-2); }
    .contato { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: var(--raio);
      background: var(--creme-2); font-size: 13px; color: var(--texto-2); }
    .contato svg { width: 18px; height: 18px; color: var(--verde); flex: none; }

    .resumo { display: grid; gap: 16px; position: sticky; top: 24px; }
    .resumo .card-titulo { margin-bottom: 0; }
    .impacto { display: grid; gap: 4px; padding: 18px 20px; border-radius: var(--raio-g); background: var(--verde); color: var(--branco); }
    .impacto svg { width: 22px; height: 22px; }
    .impacto strong { font-family: var(--fonte-titulo); font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .impacto span { font-size: 13px; color: #d6e5dc; }
    .resumo-linhas { margin: 0; display: grid; gap: 10px; font-size: 13px; }
    .resumo-linhas div { display: flex; justify-content: space-between; gap: 16px; }
    .resumo-linhas dt { color: var(--texto-3); }
    .resumo-linhas dd { margin: 0; font-weight: 700; text-align: right; }
    .alerta svg { width: 18px; height: 18px; flex: none; }

    @media (max-width: 1100px) {
      .solicitar { grid-template-columns: 1fr; }
      .resumo { position: static; }
    }
  </style>
</head>
<body>
  <div class="painel">
    <aside id="lateral"></aside>

    <main class="painel-conteudo">
      <div class="painel-cabecalho">
        <div>
          <h1>Solicitar doação</h1>
          <p>Agende a retirada diretamente com um estabelecimento parceiro.</p>
        </div>
        <button class="btn-icone painel-menu-btn" type="button" data-abrir-menu></button>
      </div>

      <!-- carregando, erro ou "oferta não encontrada" -->
      <div id="estado" aria-live="polite">
        <div class="solicitar">
          <div class="esqueleto" style="height:560px"></div>
          <div class="esqueleto" style="height:440px"></div>
        </div>
      </div>

      <div class="solicitar" id="solicitar" hidden>
        <form class="card card-pad form-solicitacao" id="form-solicitacao" aria-labelledby="t-dados">
          <h2 id="t-dados">Dados da solicitação</h2>

          <div class="loja-escolhida">
            <img id="loja-foto" src="/img/hero.jpg" alt="">
            <div>
              <span class="rotulo">Estabelecimento selecionado</span>
              <strong id="loja-nome"></strong>
              <span id="loja-endereco"></span>
            </div>
            <a href="/ong/mapa.html">Trocar</a>
          </div>

          <!-- O name de cada campo é igual ao da API: assim os erros 422 aparecem embaixo do campo certo. -->
          <div class="grade-form">
            <div class="campo">
              <label for="tipo-alimento">Tipo de alimento</label>
              <input class="entrada" id="tipo-alimento" type="text" readonly>
            </div>
            <div class="campo">
              <label for="quantidade">Quantidade (kg)</label>
              <input class="entrada" id="quantidade" name="quantidade_kg" type="number" min="0.1" step="any"
                     inputmode="decimal" required aria-describedby="quantidade-ajuda">
              <span class="ajuda" id="quantidade-ajuda"></span>
            </div>
            <div class="campo">
              <label for="data">Data da retirada</label>
              <input class="entrada" id="data" name="data_retirada" type="date" required>
            </div>
            <div class="campo">
              <label for="hora">Horário preferencial</label>
              <input class="entrada" id="hora" name="hora_retirada" type="time" required aria-describedby="hora-ajuda">
              <span class="ajuda" id="hora-ajuda"></span>
            </div>
          </div>

          <div class="campo">
            <label for="observacoes">Observações</label>
            <textarea class="entrada" id="observacoes" name="observacoes" maxlength="500"
                      placeholder="Nossa equipe irá com veículo refrigerado. Podemos retirar caixas retornáveis e realizar a pesagem no local."></textarea>
          </div>

          <p class="contato">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>
            <span id="contato"></span>
          </p>
        </form>

        <aside class="card card-pad resumo" aria-labelledby="t-resumo">
          <div class="card-titulo">
            <h2 id="t-resumo">Resumo</h2>
            <span class="badge badge-laranja-claro" id="resumo-dia"></span>
          </div>

          <div class="impacto">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>
            <strong id="resumo-refeicoes"></strong>
            <span>poderão ser preparadas com esta doação.</span>
          </div>

          <dl class="resumo-linhas">
            <div><dt>Parceiro</dt><dd id="resumo-parceiro"></dd></div>
            <div><dt>Alimentos</dt><dd id="resumo-alimentos"></dd></div>
            <div><dt>Quantidade</dt><dd id="resumo-quantidade"></dd></div>
            <div><dt>Data e hora</dt><dd id="resumo-quando"></dd></div>
            <div><dt>Distância</dt><dd id="resumo-distancia"></dd></div>
          </dl>

          <p class="alerta alerta-info">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>
            O estabelecimento confirma o pedido pelo painel do Refood.
          </p>

          <div id="erro-envio" role="alert"></div>

          <!-- O botão fica fora do <form>; o atributo form="..." liga os dois. -->
          <button class="btn btn-primario btn-bloco" id="enviar" type="submit" form="form-solicitacao">Enviar solicitação</button>
        </aside>
      </div>
    </main>
  </div>

  <script type="module" src="/js/paginas/ong-solicitar.js"></script>
</body>
</html>
